<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Загрузка…</title>

  <!-- Шрифт с Google Fonts + системный fallback (Orbitron для заголовков,
       Rajdhani для текста). Если CDN недоступен — страница остаётся рабочей. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- === Слои фона === -->
  <div class="bg" id="bg"></div>                 <!-- слайд-шоу (JS) -->
  <div class="stars stars--far"></div>           <!-- дальние звёзды -->
  <div class="stars stars--near"></div>          <!-- ближние звёзды -->
  <div class="vignette"></div>                   <!-- затемнение по краям -->

  <!-- === Основная раскладка === -->
  <div class="layout">

    <header class="header anim anim-1">
      <img class="header__logo" id="logo" src="" alt="">
      <div class="header__text">
        <h1 class="header__name" id="serverName"></h1>
        <p class="header__tagline" id="serverTagline"></p>
      </div>
    </header>

    <main class="grid">

      <!-- Карточка игрока + информация о сервере -->
      <section class="panel player-panel anim anim-2">
        <div class="player">
          <div class="player__avatar-wrap">
            <img class="player__avatar" id="playerAvatar" src="" alt="Аватар игрока">
          </div>
          <div class="player__info">
            <p class="player__greeting" id="playerGreeting"></p>
            <p class="player__name" id="playerName"></p>
          </div>
        </div>

        <dl class="server-info">
          <div class="server-info__row">
            <dt>Карта</dt><dd id="infoMap"></dd>
          </div>
          <div class="server-info__row">
            <dt>Режим</dt><dd id="infoGamemode"></dd>
          </div>
          <div class="server-info__row">
            <dt>Игроки</dt><dd id="infoPlayers"></dd>
          </div>
        </dl>
      </section>

      <!-- Прогресс загрузки («световой меч») -->
      <section class="panel progress-panel anim anim-3">
        <p class="progress__status" id="statusText">Подключение к серверу…</p>

        <div class="saber is-indeterminate" id="saber">
          <div class="saber__cap saber__cap--left"></div>
          <div class="saber__track">
            <div class="saber__fill" id="saberFill"></div>
            <div class="saber__runner"></div>
          </div>
          <div class="saber__cap saber__cap--right"></div>
        </div>

        <div class="progress__meta">
          <span class="progress__percent" id="progressPercent">Ожидание данных…</span>
          <span class="progress__files" id="progressFiles"></span>
        </div>
      </section>

      <!-- Правила (автоматическая ротация) -->
      <aside class="panel rules-panel anim anim-4">
        <h2 class="rules-panel__title" id="rulesTitle"></h2>
        <p class="rules__counter" id="rulesCounter"></p>
        <div class="rules__viewport">
          <ol class="rules__list" id="rulesList"></ol>
        </div>
      </aside>

    </main>

    <footer class="footer anim anim-5">
      <!-- Музыкальный плеер: mute/unmute + громкость -->
      <div class="music" id="musicPlayer">
        <button class="music__btn" id="muteBtn" aria-label="Включить звук"></button>
        <input type="range" class="music__volume" id="volumeSlider"
               min="0" max="100" step="1" aria-label="Громкость музыки">
        <span class="music__title" id="musicTitle"></span>
      </div>

      <!-- Ссылки на соцсети (из CONFIG) -->
      <nav class="socials" id="socials"></nav>
    </footer>

  </div>

  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
